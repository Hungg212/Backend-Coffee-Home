# Render Blueprint - Coffee Home Backend
# Deploy to Render: https://render.com/blueprints

database:
  - name: coffee-home-db
    databaseName: coffee_home
    plan: free
    ipAllowList: []

services:
  - type: web
    name: coffee-home-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: coffee-home-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: coffee-home-frontend
          envVarKey: RENDER_EXTERNAL_URL
